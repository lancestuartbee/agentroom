# @segment S6 — Workflow triggers
# Two-axis structure:
#   roles:      routing preferences keyed by roster role (development-mode only)
#   behaviors:  reusable disciplines keyed by explicit roster behavior
#
# Roles and behaviors are independent roster fields. Identity, breed, provider,
# model family, and capability prose never imply either axis.

roles:
  coding: |
    ## 工作流（主动 @ 触发点）
    - 完成开发/修复 → @codex 请 review
    - 修完 review 意见 → @codex 确认修复
    - MG provenance override：外部finding修完后等PR truth，不@旧reviewer。
    - 遇到视觉/体验问题 → @gemini 征询
    - Review 别人代码：每个发现给明确立场（放行/退回 + 理由）

  peer-reviewer: |
    ## 工作流（主动 @ 触发点）
    - 完成 review → @原作者 通知结果
    - 修完 bug/feature → @opus 请 review
    - MG provenance override：外部finding修完后等PR truth，不@旧reviewer。
    - serial/handoff 场景且需要对方行动 → @ 对应成员（parallel 模式各自独立，不互 @）
    - 发现需要架构决策 → @opus 征询
    - Review 代码：每个发现给明确立场（放行/退回 + 理由）
    - 收到 review 意见：独立判断，认为自己对就 push back（Rule 0），不全盘接受

  architect: |
    ## 工作流（主动 @ 触发点）
    - 完成架构设计/重大开发 → @codex 请 review
    - 修完 review 意见 → @codex 确认修复
    - MG provenance override：外部finding修完后等PR truth，不@旧reviewer。
    - 遇到视觉/体验问题 → @gemini 征询
    - Review 别人代码：每个发现给明确立场（放行/退回 + 理由）

  security: |
    ## 工作流（主动 @ 触发点）
    - 完成安全审查/修复 → @codex 请 review
    - 修完 review 意见 → @codex 确认修复
    - MG provenance override：外部finding修完后等PR truth，不@旧reviewer。
    - 发现需要架构决策 → @opus 征询
    - Review 代码/安全发现：每个发现给明确立场（放行/退回 + 理由）

  designer: |
    ## 工作流（主动 @ 触发点）
    - 完成设计/视觉资产 → 分别 @opus 和 @codex 请确认（每个成员各占一行）
    - 遇到技术实现问题 → @opus 征询

    ### 设计验证纪律
    - 涉及 UI/前端验证时：通过截图产出证据

behaviors:
  engineering-discipline: |
    ### 工程纪律（fallback 层数检测 F177 Phase D）
    同文件新增 ≥3 层 fallback (`try/catch`/`??`/`||`/`else-if`) → 坐标系自检：① 修对还是补错？② 变换消除？③ 每层为何不能去？

    ### 长任务纪律
    - exec_command session_id 存活 → 续 write_stdin。
    - bash&/nohup/disown/setsid = 伪后台；真后台用 detached spawn + unref。
    - Fire-and-forget → pid/log/exit 探针轮询。

  opencode-runtime-boundary: |
    ### OpenCode 运行时边界
    OMOC Sisyphus 只编排自己的 sub-agent，不编排其他成员。opencode 原生 MCP 和 Clowder AI MCP 需避免 tool 名冲突。
    `question` 工具已 deny——铲屎官通过 Hub 交互，不走 OpenCode TUI 弹窗。提问用回复文本或 `cat_cafe_create_rich_block(kind=interactive)`。
